<div class="container" style="max-width: 480px; margin-top: 60px;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="color: var(--primary);">InsecureCare</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Portal Clínico Confidencial (Entorno de Auditoría)</p>
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger">
      {{ errorMsg }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Ej: carlos_mora" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" [disabled]="loading">
        {{ loading ? 'Autenticando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--border);">
      <p style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;">
        USUARIOS DE PRUEBA PRECONFIGURADOS:
      </p>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <button type="button" class="btn btn-secondary btn-sm" (click)="fillUser('carlos_mora', 'carlos123')">
          Paciente 1: <strong>carlos_mora</strong> (ID: 3)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="fillUser('maria_rojas', 'maria123')">
          Paciente 2: <strong>maria_rojas</strong> (ID: 4)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="fillUser('dr_vargas', 'doctor2026')">
          Médico: <strong>dr_vargas</strong> (Rol: MEDICO)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="fillUser('admin', 'admin123')">
          Administrador: <strong>admin</strong> (Rol: ADMIN)
        </button>
      </div>
    </div>
  </div>
</div>
